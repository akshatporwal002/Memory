name: Engram
options:
  xcodeVersion: "26.0"
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
packages:
  Engram:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Engram-iOS:
    type: application
    platform: iOS
    sources:
      - path: App
        # Platform Info plists are build inputs, never app resources.
        excludes: ["**/*.plist", "**/*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.engram.study
        DEVELOPMENT_TEAM: 56S6XAQ96Q
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: App/Info-iOS.plist
      properties:
        CFBundleDisplayName: Engram
        NSPhotoLibraryAddUsageDescription: Save screenshots of Engram pages to Photos so you can review and share them.
        UTExportedTypeDeclarations: &engramTypes
          - UTTypeIdentifier: dev.engram.study.backup
            UTTypeDescription: Engram Complete Backup
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [engram]
        UTImportedTypeDeclarations: &ankiTypes
          - UTTypeIdentifier: net.anki.apkg
            UTTypeDescription: Anki Deck Package
            UTTypeConformsTo: [public.zip-archive]
            UTTypeTagSpecification:
              public.filename-extension: [apkg]
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: Engram
        product: LearningCore
      - package: Engram
        product: AnkiAdapters
      - package: Engram
        product: Features
      - package: Engram
        product: DesignSystem
      - package: Engram
        product: StudyApplication
      - package: Engram
        product: PersistenceAdapters
      - package: Engram
        product: SchedulingAdapters
  Engram-macOS:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes: ["**/*.plist", "**/*.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.engram.study.mac
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: App/Info-macOS.plist
      properties:
        CFBundleDisplayName: Engram
        UTExportedTypeDeclarations: *engramTypes
        UTImportedTypeDeclarations: *ankiTypes
    entitlements:
      path: App/Engram-macOS.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
    dependencies:
      - package: Engram
        product: LearningCore
      - package: Engram
        product: AnkiAdapters
      - package: Engram
        product: Features
      - package: Engram
        product: DesignSystem
      - package: Engram
        product: StudyApplication
      - package: Engram
        product: PersistenceAdapters
      - package: Engram
        product: SchedulingAdapters
schemes:
  Engram-iOS:
    build:
      targets:
        Engram-iOS: all
  Engram-macOS:
    build:
      targets:
        Engram-macOS: all
